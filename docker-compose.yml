version: "3.8"

services:
    postgres:
        image: postgres:16-alpine
        container_name: chess_postgres
        environment:
            POSTGRES_USER: chess
            POSTGRES_PASSWORD: chess_secret
            POSTGRES_DB: chess_game
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    redis: 
        image: redis:7-alpine
        container_name: chess_redis
        ports:
            - "6379:6379"

    http-backend:
        build:
            context: .
            dockerfile: apps/http-backend/Dockerfile
        container_name: chess_http_backend
        ports:
            - "3000:3000"
        environment:
            DATABASE_URL: "postgresql://chess:chess_secret@postgres:5432/chess_game"
            REDIS_URL: "redis://redis:6379"
            JWT_SECRET: "secret"
        depends_on:
            - postgres
            - redis
    
    ws: 
        build:
            context: .
            dockerfile: apps/ws/Dockerfile
        container_name: chess_ws
        ports:
            - "8080:8080"
        environment:
            DATABASE_URL: "postgresql://chess:chess_secret@postgres:5432/chess_game"
            REDIS_URL: "redis://redis:6379"
        depends_on:
            - postgres
            - redis

    frontend:
        build:
            context: .
            dockerfile: apps/frontend/Dockerfile
        container_name: chess_frontend
        ports:
            - "80:80"
        depends_on:
            - http-backend
            - ws

 
volumes:
    postgres_data:
    
